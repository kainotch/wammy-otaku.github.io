<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Page Not Found | Wammy</title>
    <link rel="icon" type="image/jpeg" href="/wammy-otaku.github.io/assets/wammy-logo.jpg">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #000; color: #fff; display: flex; align-items: center; justify-content: center; min-height: 100vh; text-align: center; padding: 24px; }
        h1 { font-size: 120px; font-weight: 800; opacity: 0.1; }
        h2 { font-size: 24px; font-weight: 600; margin-bottom: 12px; }
        p { color: #a0a0a0; margin-bottom: 32px; }
        a { color: #3b82f6; text-decoration: none; padding: 12px 24px; border: 1px solid #3b82f6; border-radius: 10px; font-weight: 600; transition: all 0.2s; }
        a:hover { background: #3b82f6; color: #fff; }
    </style>
</head>
<body>
    <div>
        <h1>404</h1>
        <h2>Page Not Found</h2>
        <p>The page you're looking for doesn't exist or has been moved.</p>
        <a href="/">Go Home</a>
    </div>
</body>
</html>
